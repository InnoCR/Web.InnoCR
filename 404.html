<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | InnoCR</title>
    <meta name="robots" content="noindex, follow">
    <style>
        :root {
            /* Paleta basada en tu imagen */
            --brand-blue: #1D3557;
            /* Azul marino oscuro del logo y textos */
            --brand-orange: #F28C28;
            /* Naranja de los iconos y botones */
            --brand-orange-hover: #D97706;
            --bg-color: #F8F9FA;
            /* Fondo gris muy claro / blanco roto */
            --card-bg: #FFFFFF;
            /* Blanco para tarjetas */
            --text-main: #2D3748;
            /* Gris oscuro para lectura */
            --text-muted: #718096;
            /* Gris medio para textos secundarios */
            --border: #E2E8F0;
            /* Bordes sutiles */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Patrón de fondo sutil */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(242, 140, 40, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(29, 53, 87, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 2;
            padding: 24px 6vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--brand-blue);
        }

        .logo-container img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--brand-blue);
        }

        .header-cta {
            text-decoration: none;
            color: var(--brand-blue);
            font-size: .95rem;
            font-weight: 600;
            padding: 10px 22px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: transparent;
            transition: all .25s ease;
        }

        .header-cta:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            background: rgba(242, 140, 40, 0.05);
        }

        main {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 6vw 80px;
            text-align: center;
        }

        .content {
            max-width: 680px;
            width: 100%;
            background: var(--card-bg);
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(29, 53, 87, 0.06);
            border: 1px solid var(--border);
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -.04em;
            color: var(--brand-blue);
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .error-code span {
            color: var(--brand-orange);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--brand-orange);
            background: rgba(242, 140, 40, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 800;
            color: var(--brand-blue);
            margin-bottom: 16px;
            letter-spacing: -.02em;
        }

        p.lead {
            color: var(--text-muted);
            font-size: clamp(1rem, 1.5vw, 1.15rem);
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 36px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            font-weight: 700;
            font-size: .95rem;
            padding: 14px 28px;
            border-radius: 8px;
            transition: all .25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--brand-orange);
            color: #fff;
            border: 2px solid var(--brand-orange);
        }

        .btn-primary:hover {
            background: var(--brand-orange-hover);
            border-color: var(--brand-orange-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(242, 140, 40, 0.3);
        }

        .btn-ghost {
            color: var(--brand-blue);
            background: transparent;
            border: 2px solid var(--border);
        }

        .btn-ghost:hover {
            border-color: var(--brand-blue);
            background: rgba(29, 53, 87, 0.03);
            transform: translateY(-2px);
        }

        footer {
            position: relative;
            z-index: 2;
            padding: 24px 6vw;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            font-size: .85rem;
            color: var(--text-muted);
            background: var(--card-bg);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: .2s;
            font-weight: 500;
        }

        footer a:hover {
            color: var(--brand-orange);
        }

        @media (max-width:520px) {
            .header-cta {
                display: none
            }

            .actions {
                flex-direction: column
            }

            .btn {
                justify-content: center;
                width: 100%
            }

            .content {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="https://innocr.com" class="logo-container" aria-label="InnoCR - Inicio">
            <!-- Logo desde la ruta especificada -->
            <img src="/img/logo.png" alt="InnoCR Logo">
        </a>
        <a href="https://innocr.com" class="header-cta">Volver al inicio</a>
    </header>

    <main>
        <div class="content">
            <!-- Diseño del código 404 con dos colores -->
            <div class="error-code" aria-hidden="true">4<span>0</span>4</div>

            <div class="badge">Página no encontrada</div>

            <h1>Ups… parece que te has desviado</h1>

            <p class="lead">
                La página que buscas no existe o ha sido movida. En <strong>InnoCR</strong> estamos listos para ayudarte
                a encontrar la solución tecnológica que necesitas.
            </p>

            <div class="actions">
                <a href="https://innocr.com" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9.5 12 3l9 6.5" />
                        <path d="M5 10v10h14V10" />
                    </svg>
                    Ir a la página principal
                </a>
                <a href="javascript:history.back()" class="btn btn-ghost">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="m12 19-7-7 7-7" />
                    </svg>
                    Volver atrás
                </a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
